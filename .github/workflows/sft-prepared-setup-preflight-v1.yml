name: SFT prepared setup preflight v1

on:
  push:
    branches:
      - codex/lumi-posttraining-product-v0.1
    paths:
      - .github/workflows/sft-prepared-setup-preflight-v1.yml

permissions:
  contents: read

concurrency:
  group: sft-prepared-setup-preflight-v1-${{ github.ref }}
  cancel-in-progress: false

jobs:
  setup-observation:
    # One approved new observation; never replay the consumed native qualification.
    if: github.event.repository.private == true && github.repository_id == '1300831104' && github.run_attempt == 1 && github.event.before == '9ae708c73a327b7cac69c16d29d075450a500e9d' && github.event.after == github.sha
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    env:
      PYTHONDONTWRITEBYTECODE: "1"
      CUDA_VISIBLE_DEVICES: ""
      HF_HUB_OFFLINE: "1"
      TRANSFORMERS_OFFLINE: "1"
      AWS_EC2_METADATA_DISABLED: "true"
    steps:
      - uses: actions/checkout@v6
        timeout-minutes: 2
        with:
          persist-credentials: false
          fetch-depth: 2
      - name: Authenticate diagnostic before tests or execution
        timeout-minutes: 1
        run: |
          set -eu
          sha256sum --check --strict <<'LUMI_PINS'
          121104c9011ea8de23b05c0af03640e52b28a6a23d2acdbba75f68169dab5da1  scripts/probe_sft_prepared_setup_v1.py
          LUMI_PINS
      - name: Synthetic preflight contracts only
        timeout-minutes: 1
        run: >-
          /usr/bin/python3 -I -S -B -m unittest discover -q -s tests
          -p test_sft_prepared_setup_preflight_v1.py
      - name: One setup observation without acquisition or pipeline
        timeout-minutes: 2
        run: |
          set -euC
          umask 077
          mkdir -p artifacts
          mkdir artifacts/lumi-sft-prepared-setup-preflight-v0.1
          timeout --signal=TERM --kill-after=5s 90s \
            sudo -n /usr/bin/env -i \
            PATH=/usr/bin:/bin LC_ALL=C.UTF-8 \
            LUMI_PREPARED_SETUP_PREFLIGHT_CI=1 LUMI_CHECKPOINT_GUARD_QUALIFICATION_CI=1 \
            /usr/bin/python3 -I -S -B scripts/probe_sft_prepared_setup_v1.py --probe-setup \
            > artifacts/lumi-sft-prepared-setup-preflight-v0.1/aggregate-setup.json 2>/dev/null
      - name: Retain only the closed setup aggregate
        if: always()
        timeout-minutes: 1
        uses: actions/upload-artifact@v4
        with:
          name: lumi-prepared-setup-preflight-v1-${{ github.sha }}
          path: artifacts/lumi-sft-prepared-setup-preflight-v0.1/aggregate-setup.json
          if-no-files-found: error
          retention-days: 14
