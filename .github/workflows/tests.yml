name: tests

on:
  push:
  pull_request:

jobs:
  frozen-lint-integrity:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: python -m pip install ruff==0.15.1
      - name: Exact historical lint debt and zero new findings
        run: python -B scripts/check_frozen_lint_v1.py

  isolated-sft-controls:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Fixed 273 control tests without site packages or ML imports
        run: python -S -B scripts/run_sft_control_ci_v1.py
      - name: CI guard regression tests
        run: >-
          python -S -B -m unittest -q
          tests/test_frozen_lint_v1.py tests/test_sft_control_ci_v1.py

  source-only-validators:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Synthetic validator and CI guard tests without private inputs
        env:
          PYTHONPATH: src
        run: >-
          python -S -B -m unittest -q
          tests/test_ci_private_fixture_plugin_v1.py
          tests/test_checkpoint_import_history_ci_v1.py
          tests/test_checkpoint_history_workflow_v1.py
          tests/test_production_source_policy_preflight_synthetic_v1.py
          tests/test_learning_candidate_seal_synthetic_v3.py
          tests/test_teacher_canary_source_promotion_preflight_synthetic_v1.py
          tests/test_vocab_report_local_ci_v1.py
          tests/test_learning_seal_local_ci_v1.py
          tests/test_ci_unresolved_inventory_v1.py

  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e '.[dev,data]'
      - name: Frozen BF16 failure reproduction and current successor acceptance
        timeout-minutes: 4
        run: python -B scripts/run_checkpoint_import_history_ci_v1.py
      - name: General suite (control suites run in their required isolated job)
        if: always()
        run: >-
          python -B -m pytest
          --ignore=tests/test_sft_source_bundle_v1.py
          --ignore=tests/test_sft_supervisor_v1.py
          --ignore=tests/test_sft_worker_admission_v1.py
          --ignore=tests/test_sft_launch_contract_v1.py
          --ignore=tests/test_process_watchdog_v1.py
          --ignore=tests/test_sft_guarded_bootstrap_v1.py
          --ignore=tests/test_sft_ledger_protocol_v1.py
          --deselect=tests/test_sft_checkpoint_import_torch_v1.py::CheckpointImportTorchTests::test_real_bfloat16_roundtrip
          --deselect=tests/test_sft_checkpoint_import_torch_v1.py::CheckpointImportTorchTests::test_real_adapter_bfloat16_and_worker_consumer
