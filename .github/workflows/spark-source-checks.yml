name: Spark source checks

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: spark-source-checks-${{ github.ref }}
  cancel-in-progress: true

jobs:
  synthetic-spark:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      PYTHONDONTWRITEBYTECODE: "1"
      SPARK_LOCAL_IP: "127.0.0.1"
      HF_HUB_OFFLINE: "1"
      TRANSFORMERS_OFFLINE: "1"
      AWS_EC2_METADATA_DISABLED: "true"
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
      - name: Install the CPU-only PyTorch build from its official index
        run: >-
          python -m pip install --no-cache-dir
          --index-url https://download.pytorch.org/whl/cpu torch==2.14.0+cpu
      - name: Install source-test dependencies while retaining the CPU-only build
        run: >-
          python -m pip install --no-cache-dir
          -e '.[dev,data]' pyspark==3.5.6 torch==2.14.0+cpu
      - name: Three original synthetic Spark tests, no skips accepted
        timeout-minutes: 15
        run: >-
          timeout --signal=TERM --kill-after=30s 12m
          python -B scripts/run_spark_source_ci_v1.py
