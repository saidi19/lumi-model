name: SFT prepared importer qualification v2

on:
  push:
    branches:
      - codex/lumi-posttraining-product-v0.1
    paths:
      - .github/workflows/sft-prepared-qualification-v2.yml

permissions:
  contents: read
  actions: read

concurrency:
  group: sft-prepared-qualification-v2-${{ github.ref }}
  cancel-in-progress: false

jobs:
  private-prepared-importer-v1:
    # Reviewed local successor. Publication and remote execution need fresh approval.
    # Fresh direct successor only. Publication/native execution needs new approval.
    # Trusted disposable hosted VM and provider actions are explicit premises;
    # cancellation/guardian-death teardown is not independently proved.
    if: github.event.repository.private == true && github.run_attempt == 1 && github.event.before == '781d4c9de9d6acf9f2161855a6089914b980a294' && github.event.after == github.sha
    runs-on: ubuntu-24.04
    timeout-minutes: 41
    env:
      PYTHONDONTWRITEBYTECODE: "1"
      PYTHONPATH: src
      CUDA_VISIBLE_DEVICES: ""
      HF_HUB_OFFLINE: "1"
      HF_DATASETS_OFFLINE: "1"
      TRANSFORMERS_OFFLINE: "1"
      HF_HUB_DISABLE_PROGRESS_BARS: "1"
      HF_HUB_DISABLE_TELEMETRY: "1"
      TOKENIZERS_PARALLELISM: "false"
      AWS_EC2_METADATA_DISABLED: "true"
      OMP_NUM_THREADS: "1"
      MKL_NUM_THREADS: "1"
      OPENBLAS_NUM_THREADS: "1"
      LUMI_PREPARED_QUALIFICATION_ACQUISITION_CI: "1"
    steps:
      - uses: actions/checkout@v6
        timeout-minutes: 2
        with:
          persist-credentials: false
          fetch-depth: 2
      - name: Verify executable pins before any software acquisition
        timeout-minutes: 1
        run: |
          set -eu
          sha256sum --check --strict <<'LUMI_PINS'
          253bb5d0b113949baecb5ea229590c1f1e2091d9f2e659abf6fbbbe9c3e1f107  scripts/run_checkpoint_prepared_qualification_v2.py
          31630b2896319e8ce9ede86ed82099506b285eb9d4366f6b4b8fb4f0311de093  scripts/supervise_checkpoint_prepared_qualification_v2.py
          7dc3543a354d3b4bca154b72ca6d2e77ffd2e229559a4f4d4da157dd46213065  scripts/prepare_sft_prepared_qualification_v2.py
          d888d17f893e8827e3a051410de5c93a6706996a232f461016b2930caad5ee26  scripts/verify_sft_prepared_qualification_v2.py
          LUMI_PINS
      - name: Verify frozen sources before any software acquisition
        timeout-minutes: 1
        run: /usr/bin/python3 -I -S -B scripts/verify_sft_prepared_qualification_v2.py --check-source
      - name: Portable pure contracts before any software acquisition
        timeout-minutes: 2
        run: |
          set -eu
          /usr/bin/python3 -S -B -m unittest -q \
            tests/test_sft_checkpoint_fixture_workspace_v1.py \
            tests/test_sft_checkpoint_prepared_qualification_v2.py \
            tests/test_sft_checkpoint_prepared_qualification_supervisor_v2.py \
            tests/test_sft_prepared_qualification_acquisition_v2.py \
            tests/test_sft_prepared_qualification_verification_v2.py \
            tests/test_sft_prepared_qualification_workflow_v2.py
      - name: Fresh four-response accepted-software acquisition
        id: software
        timeout-minutes: 7
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          timeout --signal=TERM --kill-after=15s 6m
          /usr/bin/python3 -I -S -B scripts/prepare_sft_prepared_qualification_v2.py
          --acquire-accepted-software
      - name: One independent PID-supervised prepared importer qualification
        id: native
        timeout-minutes: 23
        env:
          LUMI_IMAGE_ARCHIVE: ${{ steps.software.outputs.image_archive }}
        run: |
          set -eu
          umask 077
          sudo -n /usr/bin/env -i \
            PATH=/usr/bin:/bin LC_ALL=C.UTF-8 LUMI_CHECKPOINT_GUARD_QUALIFICATION_CI=1 \
            /usr/bin/python3 -I -S -B scripts/supervise_checkpoint_prepared_qualification_v2.py \
            --synthetic-only "$LUMI_IMAGE_ARCHIVE" \
            253bb5d0b113949baecb5ea229590c1f1e2091d9f2e659abf6fbbbe9c3e1f107 \
            > artifacts/lumi-sft-prepared-qualification-v0.2/aggregate-native.json 2>/dev/null
      - name: Retire exactly the newly acquired input
        if: always() && steps.software.outcome == 'success'
        timeout-minutes: 1
        env:
          LUMI_IMAGE_ARCHIVE: ${{ steps.software.outputs.image_archive }}
          LUMI_IMAGE_IDENTITY: ${{ steps.software.outputs.image_identity }}
          LUMI_PARENT_IDENTITY: ${{ steps.software.outputs.parent_identity }}
        run: |
          set -eu
          umask 077
          /usr/bin/python3 -I -S -B scripts/prepare_sft_prepared_qualification_v2.py --retire-input \
            "$LUMI_IMAGE_ARCHIVE" "$LUMI_IMAGE_IDENTITY" "$LUMI_PARENT_IDENTITY" \
            > artifacts/lumi-sft-prepared-qualification-v0.2/aggregate-input-cleanup.json
      - name: Exact aggregate qualification and cleanup verification
        if: always() && steps.software.outcome == 'success'
        timeout-minutes: 1
        run: >-
          /usr/bin/python3 -I -S -B scripts/verify_sft_prepared_qualification_v2.py
          --verify-receipts
      - name: Retain only the four named bounded aggregates
        if: always()
        timeout-minutes: 2
        uses: actions/upload-artifact@v4
        with:
          name: sft-prepared-qualification-v2-evidence-${{ github.sha }}
          path: |
            artifacts/lumi-sft-prepared-qualification-v0.2/aggregate-acquisition.json
            artifacts/lumi-sft-prepared-qualification-v0.2/aggregate-native.json
            artifacts/lumi-sft-prepared-qualification-v0.2/aggregate-input-cleanup.json
            artifacts/lumi-sft-prepared-qualification-v0.2/aggregate-verification.json
          if-no-files-found: warn
          retention-days: 30
