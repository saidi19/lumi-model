[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "lumi-model"
version = "0.1.0"
description = "Lumi language-model architecture and training research"
readme = "README.md"
requires-python = ">=3.12,<3.14"
authors = [
  { name = "Afnan Technologies Inc." }
]
dependencies = [
  "certifi>=2025.1.31",
  "safetensors>=0.4",
  "tokenizers>=0.22,<0.23",
  "torch>=2.5",
  "transformers>=5.2,<6",
]

[project.optional-dependencies]
apple = [
  "mlx==0.32.0; sys_platform == 'darwin' and platform_machine == 'arm64'",
  "mlx-lm==0.31.3; sys_platform == 'darwin' and platform_machine == 'arm64'",
]
benchmark-build = [
  "huggingface-hub==1.23.0",
  "pyarrow==25.0.0",
]
data = [
  "datasketch==2.0.0",
  "lingua-language-detector==2.2.0",
  "pyarrow==25.0.0",
  "zstandard==0.25.0",
]
dev = [
  "pytest>=8",
  "ruff>=0.9",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
lumi = [
  "local_ui/*.css",
  "local_ui/*.html",
  "local_ui/*.js",
  "local_ui/vendor/katex/*",
  "local_ui/vendor/katex/fonts/*",
]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
