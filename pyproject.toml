[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "lumi-model"
version = "0.1.0"
description = "Lumi language-model architecture and training research"
readme = "README.md"
requires-python = ">=3.11,<3.14"
authors = [
  { name = "Afnan Technologies Inc." }
]
dependencies = [
  "safetensors>=0.4",
  "torch>=2.5",
  "transformers>=4.50",
]

[project.optional-dependencies]
dev = [
  "pytest>=8",
  "ruff>=0.9",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
